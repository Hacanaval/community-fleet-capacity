<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=400, initial-scale=1.0">
  <title>Community Fleet Capacity — Mobile Agenda Mockup</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #e5e7eb;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    .phone {
      width: 360px;
      background: #fff;
      border-radius: 24px;
      box-shadow: 0 12px 40px rgba(0,0,0,0.2);
      overflow: hidden;
    }
    header {
      background: #065f46;
      color: #fff;
      padding: 18px 20px;
    }
    header h1 { margin: 0; font-size: 18px; font-weight: 600; }
    header p { margin: 4px 0 0; opacity: 0.85; font-size: 13px; }
    .week-switch {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 20px;
      background: #f0fdf4;
      border-bottom: 1px solid #d1fae5;
    }
    .week-switch span { font-weight: 600; font-size: 14px; color: #064e3b; }
    .week-switch button {
      background: #065f46;
      color: #fff;
      border: none;
      border-radius: 6px;
      padding: 6px 12px;
      font-size: 13px;
      cursor: pointer;
    }
    .day {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 20px;
      border-bottom: 1px solid #e5e7eb;
    }
    .day-info h3 { margin: 0 0 4px; font-size: 15px; font-weight: 600; }
    .day-info p { margin: 0; font-size: 13px; color: #6b7280; }
    .toggle { display: flex; align-items: center; gap: 10px; }
    .switch {
      width: 44px;
      height: 24px;
      background: #d1d5db;
      border-radius: 12px;
      position: relative;
      cursor: pointer;
    }
    .switch.on { background: #065f46; }
    .switch::after {
      content: '';
      position: absolute;
      width: 20px;
      height: 20px;
      background: #fff;
      border-radius: 50%;
      top: 2px;
      left: 2px;
      transition: left 0.2s;
    }
    .switch.on::after { left: 22px; }
    .capacity {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      color: #374151;
    }
    .capacity input {
      width: 50px;
      padding: 6px;
      border: 1px solid #d1d5db;
      border-radius: 6px;
      text-align: center;
      font-size: 14px;
    }
    .save {
      margin: 16px 20px 20px;
      width: calc(100% - 40px);
      padding: 14px;
      background: #065f46;
      color: #fff;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="phone">
    <header>
      <h1>My Availability</h1>
      <p>Hi Ana. Set the days you can work.</p>
    </header>

    <div class="week-switch">
      <button>Previous</button>
      <span>Sept 21 — Sept 27</span>
      <button>Next</button>
    </div>

    <div class="day">
      <div class="day-info">
        <h3>Monday, Sep 22</h3>
        <p>Portville North</p>
      </div>
      <div class="toggle">
        <div class="capacity">Max <input type="text" value="40"></div>
        <div class="switch on"></div>
      </div>
    </div>

    <div class="day">
      <div class="day-info">
        <h3>Tuesday, Sep 23</h3>
        <p>Portville North</p>
      </div>
      <div class="toggle">
        <div class="capacity">Max <input type="text" value="40"></div>
        <div class="switch on"></div>
      </div>
    </div>

    <div class="day">
      <div class="day-info">
        <h3>Wednesday, Sep 24</h3>
        <p>Portville North</p>
      </div>
      <div class="toggle">
        <div class="capacity">Max <input type="text" value="—" disabled></div>
        <div class="switch"></div>
      </div>
    </div>

    <div class="day">
      <div class="day-info">
        <h3>Thursday, Sep 25</h3>
        <p>Portville North</p>
      </div>
      <div class="toggle">
        <div class="capacity">Max <input type="text" value="35"></div>
        <div class="switch on"></div>
      </div>
    </div>

    <div class="day">
      <div class="day-info">
        <h3>Friday, Sep 26</h3>
        <p>Portville North</p>
      </div>
      <div class="toggle">
        <div class="capacity">Max <input type="text" value="—" disabled></div>
        <div class="switch"></div>
      </div>
    </div>

    <button class="save">Save week</button>
  </div>
</body>
</html>
